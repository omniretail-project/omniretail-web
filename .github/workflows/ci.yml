name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Step 1: tipos, lint, contratos y build de produccion.
  # ===========================================================================
  build-test:
    name: Tipos, lint, contratos y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: "[Step 1] Validar TypeScript"
        run: npx tsc --noEmit --incremental false

      - name: "[Step 1] Lint"
        run: npm run lint

      - name: "[Step 1] Pruebas unitarias con cobertura"
        run: npm test

      - name: "[Step 1] Verificar contratos de aplicacion"
        run: |
          npx --yes --package=tsx tsx scripts/verify-storefront-public-config-contracts.ts
          npx --yes --package=tsx tsx scripts/verify-customer-storefront-integration.ts
          npx --yes --package=tsx tsx scripts/verify-ecommerce-payment-reservation.ts
          npx --yes --package=tsx tsx scripts/verify-order-recipient-phone-shared.ts
          npx --yes --package=tsx tsx scripts/verify-catalog-media.ts
          npx --yes --package=tsx tsx scripts/verify-hardware-demo-catalog.ts
          npx --yes --package=tsx tsx scripts/verify-tenant-isolation-foundation.ts
          npx --yes --package=tsx tsx scripts/verify-storefront-second-purchase.ts
          npx --yes --package=tsx tsx scripts/verify-api-logistics-dispatch.ts
          npx --yes --package=tsx tsx scripts/verify-api-pos.ts

      - name: "[Step 1] Build de produccion"
        run: npm run build

      - name: Revisar espacios en blanco del diff del PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'

          if [[ ! "$BASE_SHA" =~ $sha_pattern || ! "$HEAD_SHA" =~ $sha_pattern ]]; then
            echo "::error title=Diff::El evento no contiene SHA validos para el Pull Request."
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA" --

      - name: Revisar espacios en blanco del diff del push
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          zero_sha='0000000000000000000000000000000000000000'

          if [[ ! "$BEFORE_SHA" =~ $sha_pattern || ! "$HEAD_SHA" =~ $sha_pattern ]]; then
            echo "::error title=Diff::El evento no contiene SHA validos para el push."
            exit 1
          fi

          git cat-file -e "${HEAD_SHA}^{commit}"

          if [[ "$BEFORE_SHA" == "$zero_sha" ]]; then
            empty_tree="$(git hash-object -t tree -w /dev/null)"
            git diff --check "$empty_tree" "$HEAD_SHA" --
          else
            git cat-file -e "${BEFORE_SHA}^{commit}"
            git diff --check "$BEFORE_SHA" "$HEAD_SHA" --
          fi

  # ===========================================================================
  # Step 2: analisis estatico con SonarQube Cloud.
  # ===========================================================================
  sonar:
    name: SonarQube Cloud
    needs: build-test
    # Los secretos no se entregan a forks. Esos PR quedan explicitamente fuera del
    # analisis; en eventos internos la configuracion faltante falla el job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Validar configuracion obligatoria de SonarQube Cloud
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          missing=()

          [[ -n "${SONAR_TOKEN:-}" ]] || missing+=("SONAR_TOKEN")
          [[ -n "${SONAR_ORGANIZATION:-}" ]] || missing+=("SONAR_ORGANIZATION")
          [[ -n "${SONAR_PROJECT_KEY:-}" ]] || missing+=("SONAR_PROJECT_KEY")

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=SonarQube::Falta configuracion obligatoria: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar necesita el historial completo para detectar codigo nuevo.
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cobertura LCOV para SonarQube Cloud
        run: npm test

      - name: "[Step 2] Analisis con SonarQube Cloud"
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ===========================================================================
  # Imagen Docker: valida que el Dockerfile construya, sin publicar nada (eso lo hace cd.yml en main).
  # ===========================================================================
  docker-build:
    name: Docker build (sin push)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: omniretail-web:ci
          build-args: |
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE || 'api' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_STOREFRONT_SLUG=${{ vars.NEXT_PUBLIC_STOREFRONT_SLUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Step 3: revision del PR con IA (Gemini). Comenta en el PR; nunca bloquea.
  # ===========================================================================
  ai-review:
    name: Revision con IA (Gemini)
    # Un fork no recibe secretos ni permisos de escritura sobre el PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: "[Step 3] Revisar diff con Gemini"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_CONTEXT: Frontend Next.js 16 (App Router) + React 19 + TypeScript, arquitectura modular por dominio, storefront multi-tenant y panel administrativo.
        run: node .github/scripts/ai-review.mjs
