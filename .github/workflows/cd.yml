name: CD

# Despliegue a produccion. Solo sale a produccion un commit de main que paso la CI completa: este workflow
# arranca cuando termina el workflow CI de un push a main (workflow_run), nunca en paralelo a el.
# Ojo: workflow_run usa la version de este archivo que esta en la rama por defecto del repo (main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Redesplegar main a mano.

concurrency:
  group: cd-production-web
  cancel-in-progress: false # Nunca cortar un despliegue a la mitad.

permissions:
  contents: read

jobs:
  image:
    name: Imagen Docker (GHCR)
    # CI verde de un push a main, o ejecucion manual sobre main. Un CI fallido o de un PR no despliega nada.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # En workflow_run, github.sha es la punta de la rama por defecto: el commit que paso la CI es head_sha.
      - name: Version a desplegar
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-xxxxxxx es la etiqueta inmutable que se despliega; latest queda solo como referencia.
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      - name: Build y push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE || 'api' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_STOREFRONT_SLUG=${{ vars.NEXT_PUBLIC_STOREFRONT_SLUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN de este run puede descargar la imagen que publico el job anterior.

    steps:
      - name: VPS no configurado
        if: vars.VPS_HOST == ''
        run: echo "::notice title=Deploy::La variable VPS_HOST esta vacia. La imagen quedo publicada en GHCR; el despliegue se omite."

      # Sin huella, el runner aceptaria cualquier servidor que responda en VPS_HOST (y le entregaria el token de GHCR).
      - name: Exigir la huella SSH del VPS
        if: vars.VPS_HOST != '' && vars.VPS_SSH_FINGERPRINT == ''
        run: |
          echo "::error title=Deploy::Falta la variable VPS_SSH_FINGERPRINT (ver deploy/README.md del backend, paso 5)."
          exit 1

      # docker-compose.prod.yml, caddy/ y scripts/deploy-service.sh viven en el repo del backend; su CD los mantiene en el VPS.
      - name: Actualizar web en el VPS
        if: vars.VPS_HOST != ''
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TAG: ${{ needs.image.outputs.tag }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          port: ${{ vars.VPS_PORT || 22 }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_SSH_FINGERPRINT }}
          command_timeout: 10m
          # Token temporal del run (expira al terminar el job): el VPS no necesita guardar un PAT propio.
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_TAG
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || '/opt/omniretail' }}"
            if [ ! -f scripts/deploy-service.sh ]; then
              echo "::error::Falta scripts/deploy-service.sh en el VPS: despliega primero el backend (su CD lo copia)."
              exit 1
            fi
            trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Fija la etiqueta, espera el healthcheck y vuelve a la version anterior si no queda sano.
            sh scripts/deploy-service.sh web "$DEPLOY_TAG"
            docker image prune -f
