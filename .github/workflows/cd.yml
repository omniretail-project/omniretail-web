name: CD

# Publica y despliega: espera un CI exitoso de un push confiable a main, publica la imagen validada en GHCR
# y la despliega en el VPS (si VPS_HOST esta configurada) con healthcheck y rollback automatico.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: cd-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Publicar imagen validada (GHCR)
    # workflow_run tiene acceso a secretos y permisos de escritura. Antes de
    # ejecutar cualquier codigo, se limita a CI exitoso, push a main y este repo.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validar procedencia del resultado de CI
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'

          if [[ "$RUN_REPOSITORY" != "$EXPECTED_REPOSITORY" || "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "::error title=Publicacion::El resultado de CI no pertenece a este repositorio."
            exit 1
          fi

          if [[ "$RUN_EVENT" != 'push' || "$RUN_BRANCH" != 'main' ]]; then
            echo "::error title=Publicacion::Solo un CI de push a main puede publicar."
            exit 1
          fi

          if [[ ! "$VERIFIED_SHA" =~ $sha_pattern ]]; then
            echo "::error title=Publicacion::El resultado de CI no contiene un SHA valido."
            exit 1
          fi

      - name: Checkout del estado actual de main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-tip
          fetch-depth: 1
          persist-credentials: false

      - name: Rechazar resultados de CI obsoletos
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(git -C main-tip rev-parse HEAD)"

          if [[ "$current_main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error title=Publicacion obsoleta::El SHA validado ya no es la punta de main."
            exit 1
          fi

      - name: Checkout del SHA validado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verificar checkout del SHA validado
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C source rev-parse HEAD)"

          if [[ "$checked_out_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error title=Publicacion::El checkout no coincide con el SHA validado por CI."
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build y push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE || 'api' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_STOREFRONT_SLUG=${{ vars.NEXT_PUBLIC_STOREFRONT_SLUG }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en VPS
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN de este run puede descargar la imagen que publico el job anterior.

    steps:
      - name: VPS no configurado
        if: vars.VPS_HOST == ''
        run: echo "::notice title=Deploy::La variable VPS_HOST esta vacia. La imagen quedo publicada en GHCR; el despliegue se omite."

      # Sin huella, el runner aceptaria cualquier servidor que responda en VPS_HOST (y le entregaria el token de GHCR).
      - name: Exigir la huella SSH del VPS
        if: vars.VPS_HOST != '' && vars.VPS_SSH_FINGERPRINT == ''
        run: |
          echo "::error title=Deploy::Falta la variable VPS_SSH_FINGERPRINT (ver deploy/README.md del backend, paso 5)."
          exit 1

      # Durante el build pudo entrar otro commit a main: un run viejo no debe pisar uno mas nuevo.
      # deploy-service.sh repite esta misma comprobacion en el VPS con el lock tomado (cierra la carrera
      # entre esta verificacion y el despliegue, y entre los CD de backend y web).
      - name: Comprobar que el commit sigue siendo la punta de main
        id: fresh
        if: vars.VPS_HOST != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -H 'Accept: application/vnd.github.sha')
          if [ "$current" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy::$VERIFIED_SHA ya no es la punta de main ($current). Se omite este despliegue obsoleto."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # No hay checkout: el VPS solo descarga la imagen ya validada. docker-compose.prod.yml, caddy/ y
      # scripts/deploy-service.sh viven en el repo del backend; su CD los mantiene en el VPS.
      - name: Actualizar web en el VPS
        if: steps.fresh.outputs.current == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Misma etiqueta inmutable que publico publish-image.
          DEPLOY_TAG: sha-${{ github.event.workflow_run.head_sha }}
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          port: ${{ vars.VPS_PORT || 22 }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_SSH_FINGERPRINT }}
          command_timeout: 10m
          # Token temporal del run (expira al terminar el job): el VPS no necesita guardar un PAT propio.
          # Tambien lo usa deploy-service.sh (solo lectura) para validar la vigencia del commit.
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_TAG,DEPLOY_REPO,DEPLOY_SHA
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || '/opt/omniretail' }}"
            if [ ! -f scripts/deploy-service.sh ]; then
              echo "::error::Falta scripts/deploy-service.sh en el VPS: despliega primero el backend (su CD lo copia)."
              exit 1
            fi
            # Credenciales de GHCR aisladas por ejecucion: un CD concurrente (backend o web) nunca hace login
            # o logout sobre las credenciales de otro. compose viene como plugin del sistema, no de ~/.docker.
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Con el lock unico del VPS (compartido con el CD del backend): valida la vigencia, descarga, fija la
            # etiqueta, espera el healthcheck, hace rollback si falla y limpia imagenes. Un commit obsoleto no toca nada.
            GITHUB_API_TOKEN="$GHCR_TOKEN" sh scripts/deploy-service.sh web "$DEPLOY_TAG"
